// =====================================
// ET3RNAL TEAM - CS2 Competitive CFG
// Optimized for FPS / Low Input Lag
// Sens: 800 DPI | 1.25 CS2 (adjust if needed)
// =====================================


// =====================
// [SENS & MOUSE]
// =====================
sensitivity "1.25"
zoom_sensitivity_ratio "1.0"
m_rawinput "1"


// =====================
// [FPS / PERFORMANCE]
// =====================
fps_max "0"
engine_low_latency_sleep_after_client_tick "true"
r_drawtracers_firstperson "true" // НЕ УБИРАТЬ: пулевые трассеры


// =====================
// [NETWORK]
// =====================
rate "786432"
cl_updaterate "128"
cl_cmdrate "128"
cl_interp "0"
cl_interp_ratio "1"
cl_net_buffer_ticks "0"


// =====================
// [REMOVE VISUAL CLUTTER]
// =====================
r_drawtracers_firstperson "true"
cl_predict_kill_ragdolls "false"
cl_predict_body_shot_fx "false"
cl_predict_head_shot_fx "false"


// =====================
// [VIEWMODEL]
// =====================
// Monesy hands
alias "hands_monesy" "viewmodel_fov 68; viewmodel_offset_x 3.5; viewmodel_offset_y -2.5; viewmodel_offset_z -3.5; echo Monesy hands"

// Donk/DeKo style hands
alias "hands_deko" "viewmodel_fov 68; viewmodel_offset_x 2.5; viewmodel_offset_y 0; viewmodel_offset_z -1.5; echo DeKo hands"

alias "hands_toggle" "hands_monesy"
alias "toggle_hands" "hands_toggle"

bind "F9" "toggle_hands"


// =====================
// [CROSSHAIR / HUD]
// =====================
cl_crosshair_drawoutline "0"
cl_crosshair_dynamic_maxdist_splitratio "0.300000"
cl_crosshair_dynamic_splitalpha_innermethod "1"
cl_crosshair_dynamic_splitalpha_outermethod "0.500000"
cl_crosshair_dynamic_splitdist "7"
cl_crosshair_outlinethickness "1.000000"
cl_crosshair_snippet "0"
cl_crosshair_t "0"
cl_crosshairalpha "255"
cl_crosshaircolor "5"
cl_crosshaircolor_b "255"
cl_crosshaircolor_g "255"
cl_crosshaircolor_r "255"
cl_crosshairdot "0"
cl_crosshairgap "-3.000000"
cl_crosshairgap_useweaponvalue "0"
cl_crosshairsize "2.000000"
cl_crosshairstyle "4"
cl_crosshairthickness "0.000000"
cl_crosshairusealpha "1"
cl_hud_radar_scale "1.05"
cl_radar_scale "0.4"
cl_radar_always_centered "0"


// =====================
// [MOVEMENT]
// =====================
bind "MWHEELUP" "+jump"
bind "MWHEELDOWN" "+jump"

bind "w" "+forward"
bind "a" "+left"
bind "s" "+back"
bind "d" "+right"

bind "SHIFT" "+sprint"
bind "CTRL" "+duck"
bind "SPACE" "+jump"


// =====================
// [MAIN BINDS]
// =====================
bind "mouse1" "+attack"
bind "mouse2" "+attack2"
bind "e" "+use"
bind "q" "lastinv"
bind "r" "+reload"
bind "g" "drop"
bind "v" "+voicerecord"
bind "f" "+lookatweapon"


// =====================
// [BUY BINDS]
// =====================
bind "F3" "buy ak47; buy m4a1; buy vesthelm; buy vest; buy molotov; buy smokegrenade; buy flashbang; buy hegrenade"

bind "F4" "buy awp; buy vesthelm; buy vest; buy molotov; buy smokegrenade; buy flashbang; buy hegrenade"

bind "F5" "buy vest; buy vesthelm; buy ak47; buy m4a1; buy deagle"

bind "F6" "buy deagle"

bind "F7" "buy p250"

bind "F8" "clear"


// =====================
// [WEAPON SLOTS]
// =====================
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "x" "slot7"


// =====================
// [SAVE]
// =====================
host_writeconfig ET3RNAL.cfg
clear 
echo ET3RNAL CFG LOADED SUCCESFULL
